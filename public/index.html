<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Demo Chat</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; padding: 16px; }
    #chat { height: 60vh; border: 1px solid #ddd; padding: 12px; overflow:auto; }
    .msg { margin: 8px 0; }
    .user { text-align: right; }
    .agent { text-align: left; }
    .bubble { display:inline-block; padding:8px 12px; border-radius:8px; max-width:80%; }
    .user .bubble { background:#0ea5a4; color:white; }
    .agent .bubble { background:#f3f4f6; color:#111827; }
  </style>
</head>
<body>
  <h2>Agent 最小 Demo</h2>
  <div id="chat"></div>
  <div style="margin-top:12px; display:flex; gap:8px;">
    <input id="input" style="flex:1;padding:8px;" placeholder="输入消息，比如：帮我生成订单表结构" />
    <button id="send">发送</button>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    const socket = io();
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    let currentAgentNode = null;

    function appendMessage(role, text, streaming=false) {
      const wrapper = document.createElement('div');
      wrapper.className = 'msg ' + (role === 'user' ? 'user' : 'agent');
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      wrapper.appendChild(bubble);
      chat.appendChild(wrapper);
      chat.scrollTop = chat.scrollHeight;
      return bubble;
    }

    // join a demo room
    const ROOM = 'conv_demo_1';
    socket.emit('join', { room: ROOM });

    socket.on('message_chunk', chunk => {
      // if streaming append to last agent bubble
      if (currentAgentNode) {
        currentAgentNode.textContent += chunk.text;
      } else {
        currentAgentNode = appendMessage('agent', chunk.text, true);
      }
    });

    socket.on('message_done', final => {
      if (currentAgentNode) {
        currentAgentNode.textContent = final.content;
        currentAgentNode = null;
      }
    });

    sendBtn.addEventListener('click', () => {
      const text = input.value.trim();
      if (!text) return;
      appendMessage('user', text);
      input.value = '';
      // start an agent response stream
      socket.emit('user_message', { room: ROOM, text });
    });

    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendBtn.click(); });
  </script>
</body>
</html>
